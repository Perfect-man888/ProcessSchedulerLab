[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "tmp", ".tmp_delivery"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
